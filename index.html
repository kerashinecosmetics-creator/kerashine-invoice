<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Kerashine Invoice</title>

<style>

/* RESET */
body {
    margin:0;
    background:#e5e5e5;
    font-family: Arial;
}

/* CONTROLS */
.controls {
    padding:20px;
    background:white;
    max-width:500px;
    margin:auto;
}

.controls input,
.controls select {
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.controls button {
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#9f4d58;
    color:white;
    font-size:15px;
    cursor:pointer;
}

/* INVOICE - FIXED A4 */
.invoice {
    width:210mm;
    /* min-height hata di - yehi empty page ka issue tha */
    margin:auto;
    background:white;
    padding:18mm 15mm 15mm 15mm;
    box-sizing:border-box;
    position:relative;
    display:flex;
    flex-direction:column;
}

.invoice-content {
    flex:1;
}

/* HEADER */
.header img {
    width:100%;
    margin-bottom:20px; /* 25 se 20 kiya */
}

/* TOP */
.top {
    display:flex;
    justify-content:space-between;
    margin-bottom:20px; /* 25 se 20 kiya */
}

.left {
    width:60%;
    font-size:13px; /* 14 se 13 kiya */
    line-height:1.5;
}

.right {
    width:35%;
    text-align:right;
    font-size:13px;
}

/* TABLE - SPACING KAM KI */
table {
    width:100%;
    border-spacing:0 6px; /* 10px se 6px kiya */
    page-break-inside:auto;
}

thead {
    display:table-header-group;
}

tfoot {
    display:table-footer-group;
}

tr {
    page-break-inside:avoid;
    page-break-after:auto;
}

th {
    background:#9f4d58;
    color:white;
    padding:10px; /* 14px se 10px kiya */
    text-align:center;
    font-size:13px;
}

td {
    background:#f3f3f3;
    padding:10px; /* 14px se 10px kiya */
    font-size:13px;
}

td:nth-child(1) { text-align:center; }
td:nth-child(3),
td:nth-child(4) { text-align:right; }

/* TERMS + SUMMARY */
.row2 {
    display:flex;
    justify-content:space-between;
    margin-top:20px; /* 30 se 20 kiya */
    page-break-inside:avoid;
}

.terms {
    width:50%;
    font-size:11px; /* 12 se 11 kiya */
}

.terms ul {
    margin:5px 0;
    padding-left:18px;
}

.summary {
    width:280px;
    font-size:12px; /* 13 se 12 kiya */
}

.summary div {
    display:flex;
    justify-content:space-between;
    margin-bottom:6px; /* 8 se 6 kiya */
}

.highlight {
    color:#9f4d58;
    font-weight:bold;
}

/* FOOTER */
.footer {
    margin-top:25px; /* 30 se 25 kiya */
    width:100%;
    page-break-inside:avoid;
}

.footer img {
    width:100%;
}

.footer-text {
    text-align:center;
    margin-top:6mm;
    font-size:10px; /* 11 se 10 kiya */
    line-height:1.4;
}

/* PRINT */
@media print {
    .controls { display:none; }
    body { background:white; }
}

.autocomplete-box {
    position:relative;
}

.suggestions {
    position:absolute;
    width:90%;
    background:white;
    border:1px solid #ddd;
    border-top:none;
    max-height:150px;
    overflow-y:auto;
    z-index:1000;
    border-radius:0 0 8px 8px;
}

.suggestions div {
    padding:10px;
    cursor:pointer;
    font-size:14px;
}

.suggestions div:hover {
    background:#f5f5f5;
}

.delete-btn {
    background:red;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="controls">
    <div class="autocomplete-box">
        <input id="customerName" placeholder="Customer Name" oninput="searchCustomer()">
        <div id="suggestions" class="suggestions"></div>
    </div>
    <input id="phone" placeholder="Phone">
    <input id="address" placeholder="Address">
    <input id="paidInput" type="number" placeholder="Amount Paid">

    <table><tbody id="items"></tbody></table>

    <button onclick="addItem()">+ Add Item</button>
    <button onclick="downloadPDF()">Download Invoice</button>
</div>

<div class="invoice" id="invoice" style="display: none;">
    <div class="invoice-content">
        <div class="header">
            <img src="header.png">
        </div>

        <div class="top">
            <div class="left">
                <b>Issued to:</b> <span id="pname"></span><br>
                <span id="pphone"></span><br>
                <span id="paddress"></span>
            </div>

            <div class="right">
                <div><b>Number:</b> <span id="inv"></span></div>
                <div><b>Date:</b> <span id="date"></span></div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>QTY</th>
                    <th>DESCRIPTION</th>
                    <th>PRICE</th>
                    <th>TOTAL</th>
                </tr>
            </thead>
            <tbody id="data"></tbody>
        </table>

        <div class="row2">
            <div class="terms">
                <b style="color:#9f4d58;">PAYMENT TERMS</b>
                <ul>
                    <li>Payment within 15 days</li>
                    <li>Bank transfer or COD</li>
                    <li>No claims after delivery</li>
                </ul>
            </div>

            <div class="summary">
                <div><span>Sub total</span><span id="sub"></span></div>
                <div><span>Discount</span><span>Rs. 0/-</span></div>
                <div class="highlight"><span>TOTAL</span><span id="totalprint"></span></div>
                <div><span>Amount Paid</span><span id="paidprint"></span></div>
                <div class="highlight"><span>Balance</span><span id="balance"></span></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <img src="footer.png">
        <div class="footer-text">
            KERASHINE – Pakistan – +92 326 8681026 <br>
            kerashinecosmetics@gmail.com
        </div>
    </div>
</div>

<script>

const products = {
    "Shampoo 500ml":1200,
    "Shampoo 250ml":800,
    "Conditioner 500ml":1200,
    "Conditioner 250ml":800,
    "Hair Mask 500ml":1200,
    "Hair Mask 300ml":500,
    "Serum 60ml":400,
    "Small Set":3500,
    "Large Set":5000,
    "Previous Bill":0,
};

const customers = [
    { name:"SEEMA SALON", phone:"+92 320 0217795", address:"North Nazimabad Karachi" },
    { name:"Maria Ali Shah", phone:"+92 311 2288016", address:"Shadman 14B" },
    { name:"NAZIA SHAKEEL SALON", phone:"+92 323 2353094", address:"Block H North Nazimabad" },
    { name:"BEENA BEAUTY SALON", phone:"+92 314 8150328", address:"New Karachi Town" },
    { name:"NOOR STUDIO", phone:"+92 321 2927073", address:"Soldier Bazaar" },
    { name:"Nargis Taqi Salon and Spa", phone:"+92 332 0007996", address:"DHA Phase 6" },
    { name:"11 ELEVEN", phone:"+92 326 2114730", address:"Bukhari Commercial" }
];

function addItem(){
    let row = document.createElement("tr");

    row.innerHTML = `
        <td><input type="number" class="qty" value="1"></td>
        <td>
            <select class="desc">
                ${Object.keys(products).map(p=>`<option>${p}</option>`).join("")}
            </select>
        </td>
        <td><input type="number" class="price" value="1200"></td>
        <td><button class="delete-btn" onclick="deleteRow(this)">❌</button></td>
    `;

    let select = row.querySelector(".desc");
    let priceInput = row.querySelector(".price");

    select.addEventListener("change", function(){
        priceInput.value = products[this.value];
    });

    priceInput.value = products[select.value];

    items.appendChild(row);
}

function deleteRow(btn){
    const row = btn.closest("tr");
    const allRows = document.querySelectorAll("#items tr");

    if(allRows.length <= 1){
        alert("At least one item required");
        return;
    }

    row.remove();
}

function format(v){
    return "Rs. " + v.toLocaleString() + "/-";
}

function generate(){

    pname.innerText = customerName.value;
    pphone.innerText = phone.value;
    paddress.innerText = address.value;

    inv.innerText = Math.floor(10 + Math.random() * 90);

    let d = new Date();
    date.innerText = d.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
    });

    let total = 0;
    let html = "";

    document.querySelectorAll("#items tr").forEach(r=>{
        let q = +r.querySelector(".qty").value;
        let d = r.querySelector(".desc").value;
        let p = +r.querySelector(".price").value;

        let t = q*p;
        total += t;

        html += `<tr>
            <td>${q}</td>
            <td>${d}</td>
            <td>${format(p)}</td>
            <td>${format(t)}</td>
        </tr>`;
    });

    data.innerHTML = html;

    let paidVal = +paidInput.value || 0;

    sub.innerText = format(total);
    totalprint.innerText = format(total);
    paidprint.innerText = format(paidVal);
    balance.innerText = format(total - paidVal);
}

function downloadPDF(){
    generate();

    const element = document.getElementById("invoice");
    element.style.display = "flex";

    const invoiceNumber = document.getElementById("inv").innerText;
    const customerName = document.getElementById("pname").innerText
                            .replace(/\s+/g, "_")
                            .replace(/[^a-zA-Z0-9_]/g, "");

    const fileName = `INV_${invoiceNumber}_${customerName}.pdf`;

    const originalWidth = document.body.style.width;
    document.body.style.width = "210mm";

    html2pdf()
    .from(element)
    .set({
        margin: 0,
        filename: fileName,
        image: { type: 'jpeg', quality: 1 },
        html2canvas: {
            scale: 2,
            useCORS: true,
            letterRendering: true,
            windowWidth: 794,
            width: 794,
            scrollY: 0 // Scroll fix
        },
        jsPDF: {
            unit: 'mm',
            format: 'a4',
            orientation: 'portrait'
        },
        pagebreak: { mode: ['css', 'legacy'] }
    })
    .save()
    .then(() => {
        element.style.display = "none";
        document.body.style.width = originalWidth;
    });
    // deletePage wala code hata diya - wahi empty page ka issue tha
}

function searchCustomer(){
    let input = customerName.value.toLowerCase();
    let box = document.getElementById("suggestions");

    box.innerHTML = "";

    if(!input){
        box.innerHTML = "";
        return;
    }

    let filtered = customers
    .filter(c => c.name.toLowerCase().includes(input))
    .sort((a,b)=> a.name.indexOf(input) - b.name.indexOf(input));

    filtered.forEach(c=>{
        let div = document.createElement("div");
        div.innerText = c.name;

        div.onclick = function(){
            customerName.value = c.name;
            phone.value = c.phone;
            address.value = c.address;
            box.innerHTML = "";
        };

        box.appendChild(div);
    });
}

document.addEventListener("click", function(e){
    if(!e.target.closest(".autocomplete-box")){
        document.getElementById("suggestions").innerHTML = "";
    }
});

window.onload = function(){
    addItem();
}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</body>
</html>
